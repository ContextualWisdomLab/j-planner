name: Finalize single-file J플래너

on:
  push:
    branches:
      - feat/single-file-travel-planner
    paths:
      - .github/workflows/finalize-single-file.yml
  pull_request:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/single-file-travel-planner
          fetch-depth: 0
      - name: Reconstruct exact verified index.html
        shell: bash
        run: |
          set -euo pipefail
          cat .final/01 .final/02 .final/03 .final/04 .final/05 .final/06 .final/07 .final/08 | base64 --decode | gzip --decompress > index.html
          echo '06cabfb1301a5f44d7d009fee338a856660ebd788b45ee1ed182d4a4cb45af25  index.html' | sha256sum --check --strict
          test "$(find . -maxdepth 1 -type f -name '*.html' -printf '%f\n')" = 'index.html'
          ! grep -Eq '<script[^>]+src=|<link[^>]+rel=["'"']stylesheet["'"']' index.html
          grep -q 'Leaflet 1.9.4' index.html
          grep -q 'L.map(' index.html
          grep -q 'router.project-osrm.org' index.html
          grep -q 'nominatim.openstreetmap.org' index.html
      - name: Remove staging artifacts and commit final tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .final
          rm -f .bootstrap
          rm -f .github/workflows/finalize-single-file.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: finalize J플래너 single-file app'
          git push origin HEAD:feat/single-file-travel-planner
