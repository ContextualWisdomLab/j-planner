<!doctype html>
<html lang="ko">
<head>

<link rel="apple-touch-icon" id="appleIcon">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--n:#1b4b7a;--b:#3f7cb0;--o:#d9724a;--g:#e0a94e;--bg:#f6f8fa;--line:#e5e9ee;--text:#1c2733;--muted:#6b7a89;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}body{margin:0;color:var(--text);background:var(--bg);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,textarea{font:inherit}button{border:0;cursor:pointer}button:active{transform:scale(.97)}.hidden{display:none!important}.appbar{position:sticky;top:0;z-index:1000;height:calc(58px + var(--st));padding:var(--st) 12px 0;display:flex;gap:8px;align-items:center;background:#fffc;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.brand{font-size:18px;font-weight:900;color:var(--n)}.top{padding:9px 10px;border-radius:11px;background:#eef4f9;color:var(--n);font-size:12px;font-weight:800}.switch{margin-left:auto;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;font-weight:800}.plus{width:36px;height:36px;border-radius:12px;background:var(--n);color:white;font-size:22px}.hero{position:relative;min-height:220px;padding:55px 20px 22px;color:#fff;background:linear-gradient(135deg,var(--n),var(--b));background-size:cover;background-position:center;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0010,#0019)}.heroin{position:relative;z-index:1;max-width:720px;margin:auto}.camera{position:absolute;right:16px;top:16px;z-index:2;width:38px;height:38px;border-radius:50%;background:#ffffff33;color:#fff}.kicker{font-size:12px;font-weight:800}.hero h1{font-size:30px;margin:7px 0 9px;letter-spacing:-1.3px}.sub{font-size:13px;line-height:1.5}.dday{display:inline-block;margin-top:13px;padding:6px 10px;border-radius:999px;background:#fff;color:var(--n);font-size:12px;font-weight:900}.pages{display:grid;grid-template-columns:1fr 1fr;background:#fff;border-bottom:1px solid var(--line)}.pages button{padding:14px;background:#fff;color:var(--muted);font-weight:900;border-bottom:3px solid transparent}.pages .active{color:var(--n);border-bottom-color:var(--n)}.dates{position:sticky;top:calc(58px + var(--st));z-index:900;display:flex;gap:8px;padding:10px 12px;overflow:auto;background:#f6f8faf2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px);scrollbar-width:none}.dates::-webkit-scrollbar{display:none}.date{min-width:76px;padding:9px 8px;background:white;border:1px solid var(--line);border-radius:14px}.date b,.date small{display:block}.date b{font-size:12px}.date small{margin-top:3px;color:var(--muted);font-size:10px}.date.active{background:var(--n);color:#fff}.date.active small{color:#dfeaf4}.main{max-width:740px;margin:auto;padding:12px 12px calc(94px + var(--sb))}.sect{display:flex;align-items:center;justify-content:space-between;margin:17px 2px 9px}.sect h2{font-size:16px;margin:0}.link{background:none;color:var(--b);font-size:12px;font-weight:900}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 16px #1637500b}.flight{padding:15px;margin-bottom:9px}.route{display:grid;grid-template-columns:1fr 48px 1fr;align-items:center}.airport b{display:block;color:var(--n);font-size:25px}.airport small{color:var(--muted)}.right{text-align:right}.plane{text-align:center;color:var(--o);font-size:20px}.docs button{width:100%;display:flex;gap:9px;text-align:left;padding:12px;background:#fff;border-bottom:1px solid var(--line)}.docs button:last-child{border-bottom:0}.docs b,.docs small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.docs small{color:var(--muted);font-size:11px}.empty{text-align:center;padding:26px 14px;color:var(--muted);font-size:12px}.day{scroll-margin-top:145px;margin-top:18px}.daytitle{font-size:14px;font-weight:900;margin:0 2px 9px}.item{display:grid;grid-template-columns:46px 1fr;gap:11px;padding:13px;margin-bottom:9px;scroll-margin-top:150px}.ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-size:21px}.time{color:var(--n);font-size:12px;font-weight:900}.name{font-weight:900;margin:3px 0 7px}.badge{display:inline-block;margin-right:4px;padding:4px 7px;border-radius:999px;background:#eef2f6;color:#536372;font-size:10px;font-weight:800}.alarm{background:#fff0e8;color:#a94f2d}.memo{margin:8px 0;color:var(--muted);font-size:12px;line-height:1.5}.acts{display:flex;gap:5px;flex-wrap:wrap}.act{padding:7px 8px;border-radius:9px;background:#f1f4f7;color:#425363;font-size:10px;font-weight:800}.act.primary{background:#e8f1f8;color:var(--n)}.bottom{position:fixed;z-index:950;left:0;right:0;bottom:0;display:grid;grid-template-columns:1fr 86px;gap:8px;padding:9px 12px calc(9px + var(--sb));background:#fffd;border-top:1px solid var(--line);backdrop-filter:blur(14px)}.primary,.secondary,.danger{padding:13px;border-radius:13px;font-weight:900}.primary{background:var(--n);color:#fff}.secondary{background:#edf2f6}.danger{background:#fff0ee;color:#b43f36}.overview{position:relative;padding-bottom:150px}.map{height:calc(100vh - 174px - var(--st));min-height:480px}.journey{position:fixed;z-index:850;left:12px;right:12px;bottom:calc(12px + var(--sb));padding:12px;border:1px solid var(--line);border-radius:16px;background:#fffffff2;box-shadow:0 9px 28px #1b4b7a22;backdrop-filter:blur(12px)}.journey strong,.journey small{display:block}.journey small{color:var(--muted);font-size:11px;margin-top:3px}.prog{height:5px;margin:9px 0;background:#e4e9ee;border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--o)}.jc{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.jc button{padding:9px;border-radius:10px;background:#edf2f6;color:var(--n);font-weight:900}.pin{width:28px;height:28px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--n);border:3px solid white;color:#fff;display:grid;place-items:center;box-shadow:0 2px 7px #0004}.pin span{transform:rotate(45deg);font-size:11px;font-weight:900}.plabel{white-space:nowrap;transform:translate(-40%,-48px);padding:4px 7px;border:1px solid #dce3e9;border-radius:7px;background:#fff;font-size:10px;font-weight:800;box-shadow:0 2px 7px #0002}.char{font-size:26px;filter:drop-shadow(0 2px 3px #0006)}.walk{animation:walk .35s steps(2) infinite}@keyframes walk{50%{transform:translateY(-3px) scaleX(-1)}}.flash{animation:flash 1.4s}@keyframes flash{45%{box-shadow:0 0 0 4px #d9724a66}}.back{position:fixed;inset:0;z-index:2000;display:flex;align-items:flex-end;background:#0d1c2b66}.sheet{width:100%;max-height:92vh;overflow:auto;padding:13px 16px calc(20px + var(--sb));border-radius:22px 22px 0 0;background:#fff;animation:up .2s ease}@keyframes up{from{transform:translateY(100%)}to{transform:none}}.handle{width:42px;height:5px;margin:auto auto 12px;border-radius:9px;background:#d7dde3}.sheet h2{margin:4px 0 14px}.field{margin:11px 0}.field label{display:block;margin-bottom:6px;color:var(--muted);font-size:11px;font-weight:800}.field input,.field textarea{width:100%;padding:11px;border:1px solid #dce3e9;border-radius:11px;outline:none}.field textarea{min-height:76px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:7px 9px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:10px;font-weight:800}.chip.sel{background:var(--n);color:#fff}.fa{display:flex;gap:7px;margin-top:16px}.fa button{flex:1}.triprow{display:flex;gap:7px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.grow{flex:1;min-width:0}.triprow .grow{background:none;text-align:left}.triprow b,.triprow small{display:block}.triprow small{color:var(--muted);font-size:10px}.mini{padding:7px;border-radius:8px;background:#eef2f6;font-size:10px;font-weight:800}.toast{position:fixed;z-index:5000;left:50%;bottom:calc(78px + var(--sb));transform:translateX(-50%) translateY(15px);opacity:0;transition:.2s;padding:9px 13px;border-radius:999px;background:#1c2733;color:#fff;font-size:11px;white-space:nowrap}.toast.show{opacity:1;transform:translateX(-50%)}.alert{position:fixed;z-index:6000;top:calc(70px + var(--st));left:12px;right:12px;padding:11px 13px;border:1px solid #ffd5c0;border-radius:13px;background:#fff3e9;color:#813b24}.settings button{display:block;width:100%;padding:13px 2px;text-align:left;background:#fff;border-bottom:1px solid var(--line);font-weight:800}.note{color:var(--muted);font-size:11px;line-height:1.55}@media(min-width:720px){.hero .camera{right:calc((100vw - 720px)/2)}.journey{max-width:716px;margin:auto}.appbar,.dates,.bottom{padding-left:max(12px,calc((100vw - 740px)/2));padding-right:max(12px,calc((100vw - 740px)/2))}}
</style>
</head>
<body>
<header class="appbar"><div class="brand">J플래너</div><button class="top" data-open="help">사용법</button><button id="switch" class="switch"></button><button class="plus" data-open="trip">+</button></header>
<section id="hero" class="hero"><button id="camera" class="camera">📷</button><input id="bg" class="hidden" type="file" accept="image/*"><div class="heroin"><div id="kicker" class="kicker"></div><h1 id="title"></h1><div id="sub" class="sub"></div><div id="dday" class="dday"></div></div></section>
<nav class="pages"><button id="ps" class="active">일정</button><button id="po">오버뷰</button></nav><div id="dates" class="dates"></div>
<main id="schedule" class="main"><section><div class="sect"><h2>✈️ 항공편</h2><button class="link" data-open="flight">+ 항공편 추가</button></div><div id="flights"></div></section><section><div class="sect"><h2>🗂 예약 서류함</h2></div><div id="docs" class="card docs"></div></section><section id="items"></section></main>
<section id="overview" class="overview hidden"><div id="map" class="map"></div><div class="journey"><strong id="jt">일정을 선택하세요</strong><small id="jm"></small><div class="prog"><i id="jp"></i></div><div class="jc"><button id="prev">이전</button><button id="now">지금</button><button id="next">다음</button></div></div></section>
<footer id="bottom" class="bottom"><button class="primary" data-open="item">+ 일정 추가</button><button class="secondary" data-open="settings">설정</button></footer><div id="host"></div><div id="toast" class="toast"></div><div id="alarmPop" class="alert hidden"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KEY='jplanner.v1',C={항공:['✈️','#dceafe'],숙소:['🏨','#e8e0fa'],식당:['🍽️','#ffe5dc'],카페:['☕','#f5e8d8'],명소:['📍','#dff1e4'],이동:['🚇','#dceff5'],쇼핑:['🛍️','#fce2ee'],기타:['⭐','#eee9d8']},MOV=['도보','지하철','버스','트램','기차','택시','항공','자전거'];let S,day='',page='s',map,layers=[],ji=0,docsPending=[];const $=q=>document.querySelector(q),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7),esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c));function get(){try{return localStorage.getItem(KEY)}catch(e){return null}}function put(){try{localStorage.setItem(KEY,JSON.stringify(S));return 1}catch(e){toast('저장 공간을 사용할 수 없어요');return 0}}function pd(s){return new Date(s+'T12:00:00')}function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function between(a,b){return Math.round((pd(b)-pd(a))/86400000)}function range(a,b){let r=[],d=pd(a),e=pd(b);for(;d<=e;d.setDate(d.getDate()+1))r.push(ymd(d));return r}function sample(){return{trips:[{id:'sample',title:'도쿄 가을 산책',start:'2026-10-10',end:'2026-10-12',note:'2인',cities:['도쿄'],flights:[{id:'f1',from:'ICN',fromCity:'서울',depart:'08:10',to:'NRT',toCity:'도쿄',arrive:'10:35'}],items:[{id:'i1',day:'2026-10-10',time:'14:00',cat:'숙소',name:'시부야 호텔 체크인',place:'Shibuya Stream Excel Hotel Tokyu',mapUrl:'',memo:'짐 맡기고 잠깐 휴식',move:'기차',alarm:'13:30',lat:35.6573,lng:139.703,userDocs:[]},{id:'i2',day:'2026-10-10',time:'18:00',cat:'식당',name:'시부야 저녁식사',place:'Shibuya Scramble Square',mapUrl:'',memo:'예약 시간 10분 전 도착',move:'도보',alarm:'17:30',lat:35.658,lng:139.7016,userDocs:[]},{id:'i3',day:'2026-10-11',time:'09:30',cat:'명소',name:'메이지 신궁',place:'Meiji Jingu',mapUrl:'',memo:'아침 산책',move:'지하철',alarm:'09:00',lat:35.6764,lng:139.6993,userDocs:[]},{id:'i4',day:'2026-10-11',time:'13:00',cat:'카페',name:'오모테산도 카페',place:'Omotesando Tokyo',mapUrl:'',memo:'커피와 디저트',move:'도보',alarm:'12:40',lat:35.6652,lng:139.7123,userDocs:[]},{id:'i5',day:'2026-10-12',time:'10:30',cat:'쇼핑',name:'도쿄역 기념품 쇼핑',place:'Tokyo Station',mapUrl:'',memo:'공항 가기 전 마지막 쇼핑',move:'기차',alarm:'10:00',lat:35.6812,lng:139.7671,userDocs:[]}]}],activeId:'sample'}}function norm(x){if(!x||!Array.isArray(x.trips)||!x.trips.length)x=sample();x.trips.forEach(t=>{t.cities=Array.isArray(t.cities)?t.cities:[];t.flights=Array.isArray(t.flights)?t.flights:[];t.items=Array.isArray(t.items)?t.items:[];t.items.forEach(i=>i.userDocs=Array.isArray(i.userDocs)?i.userDocs:[])});if(!x.trips.some(t=>t.id===x.activeId))x.activeId=x.trips[0].id;return x}function load(){try{S=norm(JSON.parse(get()||'null'))}catch(e){S=sample()}put()}function a(){return S.trips.find(t=>t.id===S.activeId)||S.trips[0]}function toast(m){let t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1700)}function save(m){put();render();if(m)toast(m)}function fmt(s){let d=pd(s);return`${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`}function city(t,i){if(!t.cities.length)return'';return t.cities[Math.min(t.cities.length-1,Math.floor(i*t.cities.length/Math.max(1,range(t.start,t.end).length)))]}function render(){let t=a(),ds=range(t.start,t.end);if(!ds.includes(day))day=ds[0];$('#switch').textContent=t.title+' ▾';$('#kicker').textContent=(t.cities.join(' · ')?t.cities.join(' · ')+' · ':'')+pd(t.start).getFullYear();$('#title').textContent=t.title;let n=between(t.start,t.end);$('#sub').textContent=`${fmt(t.start)} – ${fmt(t.end)} · ${n}박 ${n+1}일${t.note?' · '+t.note:''}`;let td=ymd(new Date()),d=between(td,t.start);$('#dday').textContent=d>0?'D-'+d:td===t.start?'D-DAY':td>=t.start&&td<=t.end?'여행 '+(between(t.start,td)+1)+'일차':'여행 종료';$('#hero').style.backgroundImage=t.bg?`url(${t.bg})`:'linear-gradient(135deg,#1b4b7a,#3f7cb0)';$('#dates').innerHTML=ds.map((x,i)=>{let z=pd(x);return`<button class="date ${x===day?'active':''}" data-day="${x}"><b>${'일월화수목금토'[z.getDay()]} · ${z.getMonth()+1}/${z.getDate()}</b><small>${esc(
